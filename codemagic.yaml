workflows:
  ios-release:
    name: iOS Release & TestFlight
    # 1. Add this block right below the workflow name:
    integrations:
      app_store_connect: "apkingsAPIkeyCICD"
      
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    environment:
      groups:
        - production
      
      ios_signing:

        distribution_type: app_store
        bundle_identifier: com.apkings.grapheneterminal
    
      vars:
        XCODE_WORKSPACE: "ios/GrapheneTerminal.xcworkspace"
        XCODE_SCHEME: "GrapheneTerminal"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install JS Dependencies
        script: npm install --legacy-peer-deps
        
      - name: Inject Production Environment Variables
        script: |
          echo "Generating native config for production..."
          cat <<EOF > ios/GrapheneTerminal/GeneratedDotEnv.m
          #import <Foundation/Foundation.h>

          @interface GeneratedDotEnv : NSObject
          + (NSString *)apiUrl;
          @end

          @implementation GeneratedDotEnv
          + (NSString *)apiUrl {
              return @"$API_URL";
          }
          @end
          EOF
          echo "Native configuration successfully injected."

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      
      - name: Generate React Native Offline Bundle
        script: |
          npx react-native bundle \
            --entry-file index.js \
            --platform ios \
            --dev false \
            --bundle-output ios/main.jsbundle \
            --assets-dest ios

      - name: Create Production Env File
        script: |
          echo "Seeding production environment configuration..."
          touch .env
          
          # Manually stub GeneratedDotEnv files to satisfy Xcode's early dependency scan
          echo "Creating GeneratedDotEnv stubs..."
          cat <<EOF > ios/GeneratedDotEnv.h
          #define DOT_ENV @{  }
          EOF

          cat <<EOF > ios/GeneratedDotEnv.m
          #import "GeneratedDotEnv.h"
          EOF
        
      - name: Generate Export Options & Link Profiles
        script: |
          xcode-project use-profiles

      - name: Build iOS Release Archive (.ipa)
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true


      