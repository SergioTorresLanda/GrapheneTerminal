workflows:
  ios-release:
    name: iOS Release & TestFlight
    # 1. Add this block right below the workflow name:
    integrations:
      app_store_connect: "apkingsAPIkeyCICD"
      
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    environment:
      groups:
        - production
      vars:
        XCODE_WORKSPACE: "ios/GrapheneTerminal.xcworkspace"
        XCODE_SCHEME: "GrapheneTerminal"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install JS Dependencies
        script: npm install --legacy-peer-deps
        
      - name: Inject Production Environment Variables
        script: |
          echo "Generating native config for production..."
          cat <<EOF > ios/GrapheneTerminal/GeneratedDotEnv.m
          #import <Foundation/Foundation.h>

          @interface GeneratedDotEnv : NSObject
          + (NSString *)apiUrl;
          @end

          @implementation GeneratedDotEnv
          + (NSString *)apiUrl {
              return @"$API_URL";
          }
          @end
          EOF
          echo "Native configuration successfully injected."

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Initialize App Store Connect Code Signing
        script: |
          echo "1. Initializing remote keychain..."
          keychain initialize
          
          echo "2. Fetching certificates and profiles from Apple..."
          app-store-connect fetch-signing-files $(xcode-project detect-bundle-id) --type IOS_APP_STORE --create
          
          echo "3. Adding fetched certificates to keychain..."
          keychain add-certificates
          
          echo "4. Linking profiles to Xcode workspace..."
          xcode-project use-profiles

      - name: Build iOS Release Archive (.ipa)
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true


      